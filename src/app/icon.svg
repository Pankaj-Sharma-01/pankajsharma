<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- "PS" monogram. Colours mirror the design tokens in globals.css
       (background, hot, sun, accent); an icon file cannot read CSS variables. -->
  <defs>
    <linearGradient id="sunrise" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="11" fill="#0b0620" stroke="#05d9e8" stroke-width="3"/>
  <g fill-rule="evenodd">
    <!-- Offset cyan and pink copies give the letters a glitch "buzz". -->
    <g fill="#05d9e8" opacity="0.9" transform="translate(-2 0)">
      <path d="M10 14H26L31 19V31L26 36H17V50H10ZM17 20.5H24V29.5H17Z"/>
      <path d="M39 14H55V21H41V28.5H50L55 33.5V45L50 50H34V43H48V35.5H39L34 30.5V19Z"/>
    </g>
    <g fill="#ff2a6d" opacity="0.9" transform="translate(2 1)">
      <path d="M10 14H26L31 19V31L26 36H17V50H10ZM17 20.5H24V29.5H17Z"/>
      <path d="M39 14H55V21H41V28.5H50L55 33.5V45L50 50H34V43H48V35.5H39L34 30.5V19Z"/>
    </g>
    <g fill="#f5f0ff">
      <path d="M10 14H26L31 19V31L26 36H17V50H10ZM17 20.5H24V29.5H17Z"/>
      <path d="M39 14H55V21H41V28.5H50L55 33.5V45L50 50H34V43H48V35.5H39L34 30.5V19Z"/>
    </g>
  </g>
  <!-- Scanline cut through both letters. -->
  <rect x="6" y="39" width="52" height="1.6" fill="#0b0620"/>
  <rect x="9" y="54" width="46" height="2.2" fill="url(#sunrise)"/>
</svg>
